{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoàn tất — WebGIS TP.HCM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'webgis/css/password_reset.css' %}">
</head>
<body>
<div class="pr-container" style="text-align:center;">
    <div class="pr-logo" style="justify-content:center;">
        <div class="pr-logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="10"/>
                <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
        </div>
        <div class="pr-logo-text">WebGIS TPHCM<span>Môi trường đô thị</span></div>
    </div>

    <div class="pr-success-icon" style="background:linear-gradient(135deg,#06D6A0,#087F5B);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"/>
        </svg>
    </div>

    <h2>Thành công!</h2>
    <div class="pr-success-box">
        Mật khẩu của bạn đã được cập nhật.<br>
        Hãy đăng nhập với mật khẩu mới.
    </div>

    <a href="/login/" class="pr-btn" style="display:block;text-decoration:none;">Đăng nhập ngay →</a>
</div>
</body>
</html>

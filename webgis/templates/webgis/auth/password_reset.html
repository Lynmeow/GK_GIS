{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu — WebGIS TP.HCM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'webgis/css/password_reset.css' %}">
</head>
<body>
<div class="pr-container">
    <div class="pr-logo">
        <div class="pr-logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="10"/>
                <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
        </div>
        <div class="pr-logo-text">WebGIS TPHCM<span>Môi trường đô thị</span></div>
    </div>

    <div class="pr-tag">🔑 Khôi phục mật khẩu</div>
    <h2>Quên mật khẩu?</h2>
    <p class="pr-subtitle">Nhập email đã đăng ký, hệ thống sẽ gửi link đặt lại mật khẩu về hộp thư của bạn.</p>

    <form method="post">
        {% csrf_token %}
        <div class="pr-field">
            <label class="pr-label">Email</label>
            <div class="pr-input-wrap">
                <svg class="pr-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                    <polyline points="22,6 12,13 2,6"/>
                </svg>
                <input type="email" name="email" class="pr-input" placeholder="example@gmail.com" required>
            </div>
        </div>
        <button type="submit" class="pr-btn">Gửi link đặt lại →</button>
    </form>

    <a href="/login/" class="pr-back">← Quay lại đăng nhập</a>
</div>
</body>
</html>

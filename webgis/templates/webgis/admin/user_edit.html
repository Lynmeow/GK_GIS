{% extends 'webgis/admin/base_admin.html' %}
{% block title %}Sửa người dùng{% endblock %}
{% block breadcrumb %}Người dùng › Chỉnh sửa{% endblock %}

{% block content %}
<div class="page-header animate-up">
<div>
<div class="page-title">✏️ Chỉnh sửa tài khoản</div>
<div class="page-subtitle">{{ edit_user.username }}</div>
</div>
<a href="{% url 'admin_users' %}" class="btn btn-ghost">← Quay lại</a>
</div>

<div style="max-width:560px">
<div class="table-card animate-up">
<div class="table-header">
    <div class="table-title">Thông tin tài khoản</div>
</div>
<div style="padding:24px">
    <form method="POST" action="{% url 'admin_user_edit' edit_user.id %}">
    {% csrf_token %}
    <div class="form-row">
        <div class="form-group">
        <label class="form-label">Tên đăng nhập</label>
        <input type="text" class="form-control" value="{{ edit_user.username }}" disabled style="opacity:0.6">
        </div>
        <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ edit_user.email }}">
        </div>
    </div>
    <div class="form-row">
        <div class="form-group">
        <label class="form-label">Vai trò</label>
        <select name="role" class="form-control">
            <option value="viewer" {% if profile.role == 'viewer' %}selected{% endif %}>👁️ Người xem</option>
            <option value="researcher" {% if profile.role == 'researcher' %}selected{% endif %}>🔬 Nhà nghiên cứu</option>
            <option value="admin" {% if profile.role == 'admin' %}selected{% endif %}>👑 Admin</option>
        </select>
        </div>
        <div class="form-group">
        <label class="form-label">Điện thoại</label>
        <input type="text" name="phone" class="form-control" value="{{ profile.phone }}">
        </div>
    </div>
    <div class="form-group">
        <label class="form-label">Tổ chức / Đơn vị</label>
        <input type="text" name="organization" class="form-control" value="{{ profile.organization }}">
    </div>
    <div class="form-group">
        <label class="form-label">Mật khẩu mới (để trống nếu không đổi)</label>
        <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu mới...">
    </div>
    <div class="form-group">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" name="is_active" {% if edit_user.is_active %}checked{% endif %}
            style="width:16px;height:16px;accent-color:var(--primary)">
        <span style="font-size:13px;font-weight:600;color:var(--text-secondary)">Tài khoản đang hoạt động</span>
        </label>
    </div>
    <div class="form-footer">
        <a href="{% url 'admin_users' %}" class="btn btn-ghost">Hủy</a>
        <button type="submit" class="btn btn-primary">💾 Lưu thay đổi</button>
    </div>
    </form>
</div>
</div>
</div>
{% endblock %}
